x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  N8N_HOST: ${N8N_HOST:-localhost}
  N8N_PORT: 5678
  N8N_PROTOCOL: http
  WEBHOOK_URL: http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
  GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Paris}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

services:
  postgres:
    image: postgres:16-alpine
    container_name: rh_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: rh_ollama
    restart: unless-stopped
    env_file: .env
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

  pdf-extractor:
    build: ./services/pdf-extractor
    container_name: rh_pdf_extractor
    restart: unless-stopped
    ports:
      - "${PDF_EXTRACTOR_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: rh_n8n
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      pdf-extractor:
        condition: service_healthy
    environment:
      <<: *n8n-env
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/generated:/config:ro

  n8n-import:
    image: n8nio/n8n:latest
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/generated:/config:ro
    entrypoint: ["n8n"]
    profiles: ["tools"]

volumes:
  postgres_data:
  ollama_data:
  n8n_data:
